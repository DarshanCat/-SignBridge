<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 24" width="100%" height="24">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="20%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#FF007A"/>
      <stop offset="80%" stop-color="#7928CA"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>

    <filter id="divGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .pulse-line {
      stroke-dasharray: 60, 140;
      animation: lineSweep 3s linear infinite;
    }
    @keyframes lineSweep {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -400; }
    }

    .gem-pulse {
      animation: gemBlink 2s ease-in-out infinite alternate;
    }
    @keyframes gemBlink {
      0% { transform: scale(0.9); filter: drop-shadow(0 0 2px #00F5FF); }
      100% { transform: scale(1.2); filter: drop-shadow(0 0 10px #FF007A); }
    }
  </style>

  <line x1="20" y1="12" x2="900" y2="12" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>
  <line x1="20" y1="12" x2="900" y2="12" stroke="url(#divGrad)" stroke-width="2.5" class="pulse-line" filter="url(#divGlow)"/>

  <!-- Center Diamond Emblem -->
  <g transform="translate(460, 12)" class="gem-pulse">
    <polygon points="0,-7 7,0 0,7 -7,0" fill="#00F5FF" stroke="#FF007A" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="2" fill="#FFFFFF"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarDarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C1B"/>
      <stop offset="50%" stop-color="#0C132C"/>
      <stop offset="100%" stop-color="#060914"/>
    </linearGradient>

    <linearGradient id="boneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <linearGradient id="glowTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <filter id="boneGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Arm signing animation */
    .left-arm-group {
      transform-origin: 210px 105px;
      animation: signMotionLeft 3.6s ease-in-out infinite alternate;
    }
    @keyframes signMotionLeft {
      0% { transform: rotate(0deg); }
      35% { transform: rotate(-35deg) translateY(-10px); }
      70% { transform: rotate(-15deg) translateY(-25px); }
      100% { transform: rotate(-45deg) translateY(-15px); }
    }

    .right-arm-group {
      transform-origin: 290px 105px;
      animation: signMotionRight 3.6s ease-in-out infinite alternate;
    }
    @keyframes signMotionRight {
      0% { transform: rotate(0deg); }
      35% { transform: rotate(35deg) translateY(-10px); }
      70% { transform: rotate(15deg) translateY(-25px); }
      100% { transform: rotate(45deg) translateY(-15px); }
    }

    .head-tilt {
      transform-origin: 250px 70px;
      animation: headMotion 5s ease-in-out infinite alternate;
    }
    @keyframes headMotion {
      0% { transform: rotate(0deg); }
      50% { transform: rotate(3deg) translateY(-2px); }
      100% { transform: rotate(-3deg) translateY(0px); }
    }

    .aura-wave {
      animation: auraPulse 2.5s ease-in-out infinite alternate;
    }
    @keyframes auraPulse {
      0% { opacity: 0.3; transform: scale(0.95); }
      100% { opacity: 0.8; transform: scale(1.05); }
    }

    .hud-text-bright {
      font-family: 'Courier New', monospace, Consolas;
      font-size: 11px;
      font-weight: 700;
      fill: #34D399;
    }

    .hud-label {
      font-family: 'Courier New', monospace, Consolas;
      font-size: 11px;
      fill: #94A3B8;
    }
  </style>

  <!-- Container Base -->
  <rect x="2" y="2" width="916" height="336" rx="16" fill="url(#avatarDarkBg)" stroke="#1E293B" stroke-width="2"/>

  <!-- Radial grid background around avatar -->
  <circle cx="250" cy="170" r="140" fill="none" stroke="rgba(56, 189, 248, 0.08)" stroke-width="1.5" stroke-dasharray="3, 8"/>
  <circle cx="250" cy="170" r="90" fill="none" stroke="rgba(56, 189, 248, 0.12)" stroke-width="1.5"/>

  <!-- ================= AVATAR SKELETAL RIG (LEFT SIDE) ================= -->
  <!-- Torso & Spine -->
  <g filter="url(#boneGlow)">
    <!-- Spine Line -->
    <line x1="250" y1="95" x2="250" y2="240" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Pelvis -->
    <line x1="220" y1="240" x2="280" y2="240" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Chest / Shoulders -->
    <line x1="210" y1="105" x2="290" y2="105" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>

    <!-- Pelvis to Hip Joints -->
    <circle cx="220" cy="240" r="5" fill="#10B981"/>
    <circle cx="280" cy="240" r="5" fill="#10B981"/>

    <!-- Head & Neck -->
    <g class="head-tilt">
      <line x1="250" y1="95" x2="250" y2="70" stroke="#38BDF8" stroke-width="3.5"/>
      <circle cx="250" cy="50" r="24" fill="rgba(56, 189, 248, 0.15)" stroke="#38BDF8" stroke-width="2.5"/>
      <!-- Eyes visor -->
      <line x1="240" y1="48" x2="260" y2="48" stroke="#00F5FF" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Chest Energy Core (Spark) -->
    <circle cx="250" cy="135" r="9" fill="#10B981" class="aura-wave" filter="url(#boneGlow)"/>
    <circle cx="250" cy="135" r="4" fill="#FFFFFF"/>

    <!-- Left Arm Assembly (Animated Signing) -->
    <g class="left-arm-group">
      <!-- Upper arm -->
      <line x1="210" y1="105" x2="180" y2="165" stroke="#818CF8" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="210" cy="105" r="5" fill="#00F5FF"/>
      <!-- Forearm & Hand -->
      <g transform="translate(180, 165)">
        <circle cx="0" cy="0" r="4.5" fill="#00F5FF"/>
        <line x1="0" y1="0" x2="35" y2="30" stroke="#C084FC" stroke-width="3" stroke-linecap="round"/>
        <!-- Hand / Fingers -->
        <circle cx="35" cy="30" r="6" fill="#FF007A" filter="url(#boneGlow)"/>
        <line x1="35" y1="30" x2="45" y2="22" stroke="#FF007A" stroke-width="1.8"/>
        <line x1="35" y1="30" x2="48" y2="30" stroke="#FF007A" stroke-width="1.8"/>
        <line x1="35" y1="30" x2="44" y2="38" stroke="#FF007A" stroke-width="1.8"/>
      </g>
    </g>

    <!-- Right Arm Assembly (Animated Signing) -->
    <g class="right-arm-group">
      <!-- Upper arm -->
      <line x1="290" y1="105" x2="320" y2="165" stroke="#818CF8" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="290" cy="105" r="5" fill="#00F5FF"/>
      <!-- Forearm & Hand -->
      <g transform="translate(320, 165)">
        <circle cx="0" cy="0" r="4.5" fill="#00F5FF"/>
        <line x1="0" y1="0" x2="-35" y2="30" stroke="#C084FC" stroke-width="3" stroke-linecap="round"/>
        <!-- Hand / Fingers -->
        <circle cx="-35" cy="30" r="6" fill="#FF007A" filter="url(#boneGlow)"/>
        <line x1="-35" y1="30" x2="-45" y2="22" stroke="#FF007A" stroke-width="1.8"/>
        <line x1="-35" y1="30" x2="-48" y2="30" stroke="#FF007A" stroke-width="1.8"/>
        <line x1="-35" y1="30" x2="-44" y2="38" stroke="#FF007A" stroke-width="1.8"/>
      </g>
    </g>

    <!-- Legs Base -->
    <line x1="220" y1="240" x2="205" y2="305" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
    <line x1="280" y1="240" x2="295" y2="305" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- ================= RIGHT: AVATAR ENGINE CONTROLS ================= -->
  <g transform="translate(480, 25)">
    <!-- Header -->
    <rect width="400" height="32" rx="6" fill="rgba(16, 185, 129, 0.1)" stroke="#10B981" stroke-width="1.2"/>
    <circle cx="16" cy="16" r="4" fill="#10B981" filter="url(#boneGlow)"/>
    <text x="28" y="21" fill="#34D399" font-family="'Courier New', monospace" font-size="12" font-weight="700">
      🎭 REACT THREE FIBER // SKELETAL RIG CONTROLLER
    </text>

    <!-- Block 1: Kinematics -->
    <g transform="translate(0, 50)">
      <rect width="400" height="90" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="#334155" stroke-width="1"/>
      <text x="15" y="24" class="hud-label">INTERPOLATION ENGINE :</text>
      <text x="210" y="24" class="hud-text-bright">SPHERICAL LERP (SLERP)</text>

      <text x="15" y="48" class="hud-label">KEYFRAME TRANSITIONS :</text>
      <text x="210" y="48" class="hud-text-bright">EASE-IN-OUT (300ms)</text>

      <text x="15" y="72" class="hud-label">RENDER PIPELINE     :</text>
      <text x="210" y="72" class="hud-text-bright">WEBGL2 / 60.0 FPS</text>
    </g>

    <!-- Block 2: Live Bone Quaternions -->
    <g transform="translate(0, 155)">
      <rect width="400" height="95" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="#334155" stroke-width="1"/>
      <text x="15" y="22" fill="#94A3B8" class="hud-label">ACTIVE QUATERNION ROTATIONS:</text>
      
      <text x="15" y="44" fill="#38BDF8" class="hud-label">left_shoulder :</text>
      <text x="170" y="44" fill="#C084FC" class="hud-label">Q[0.12, 0.45, -0.22, 0.86]</text>

      <text x="15" y="64" fill="#38BDF8" class="hud-label">right_shoulder:</text>
      <text x="170" y="64" fill="#C084FC" class="hud-label">Q[-0.14, -0.42, 0.20, 0.88]</text>

      <text x="15" y="84" fill="#38BDF8" class="hud-label">neck / spine  :</text>
      <text x="170" y="84" fill="#C084FC" class="hud-label">Q[0.00, 0.05, 0.00, 0.99]</text>
    </g>

    <!-- Bottom Status Bar -->
    <g transform="translate(0, 265)">
      <rect width="400" height="30" rx="6" fill="rgba(99, 102, 241, 0.1)" stroke="#6366F1" stroke-width="1"/>
      <text x="15" y="20" fill="#A5B4FC" font-family="'Courier New', monospace" font-size="11" font-weight="700">
        STATUS: IDLE_SWAY LOOP RUNNING (WAITING FOR GLOSS)
      </text>
    </g>
  </g>
</svg>

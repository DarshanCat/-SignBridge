<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="nnDarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070914"/>
      <stop offset="50%" stop-color="#0E1326"/>
      <stop offset="100%" stop-color="#060810"/>
    </linearGradient>

    <!-- Synapse Gradients -->
    <linearGradient id="synapseFwd" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#FF007A"/>
    </linearGradient>

    <linearGradient id="synapseBwd" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF007A"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#00F5FF"/>
    </linearGradient>

    <linearGradient id="barGlowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="12" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="synapseGlow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Synaptic Pulse Animations (Forward Flow) */
    .syn-pulse-fast {
      stroke-dasharray: 8, 24;
      animation: synFlow 1.2s linear infinite;
    }
    .syn-pulse-med {
      stroke-dasharray: 10, 30;
      animation: synFlow 1.8s linear infinite;
    }
    .syn-pulse-slow {
      stroke-dasharray: 12, 36;
      animation: synFlow 2.4s linear infinite;
    }
    @keyframes synFlow {
      to { stroke-dashoffset: -96; }
    }

    /* Reverse Temporal Feedback (Backward BiGRU) */
    .syn-pulse-bwd {
      stroke-dasharray: 8, 20;
      animation: synFlowBwd 1.5s linear infinite;
    }
    @keyframes synFlowBwd {
      to { stroke-dashoffset: 80; }
    }

    /* Neuron Node Pulsing */
    .neuron-in {
      animation: nPulseIn 2s ease-in-out infinite alternate;
    }
    @keyframes nPulseIn {
      0% { r: 5px; fill: #00F5FF; filter: drop-shadow(0 0 4px #00F5FF); }
      100% { r: 7.5px; fill: #38BDF8; filter: drop-shadow(0 0 12px #00F5FF); }
    }

    .neuron-fwd {
      animation: nPulseFwd 2.4s ease-in-out infinite alternate;
    }
    @keyframes nPulseFwd {
      0% { r: 7px; fill: #8B5CF6; filter: drop-shadow(0 0 4px #8B5CF6); }
      100% { r: 9.5px; fill: #A855F7; filter: drop-shadow(0 0 16px #A855F7); }
    }

    .neuron-bwd {
      animation: nPulseBwd 2.4s ease-in-out infinite alternate 0.4s;
    }
    @keyframes nPulseBwd {
      0% { r: 7px; fill: #EC4899; filter: drop-shadow(0 0 4px #EC4899); }
      100% { r: 9.5px; fill: #FF007A; filter: drop-shadow(0 0 16px #FF007A); }
    }

    .neuron-out {
      animation: nPulseOut 1.8s ease-in-out infinite alternate 0.2s;
    }
    @keyframes nPulseOut {
      0% { r: 8px; fill: #10B981; filter: drop-shadow(0 0 4px #10B981); }
      100% { r: 11px; fill: #34D399; filter: drop-shadow(0 0 20px #10B981); }
    }

    /* Prediction probability bar oscillation */
    .prob-bar-top {
      animation: probOsc 2s ease-in-out infinite alternate;
    }
    @keyframes probOsc {
      0% { width: 145px; }
      100% { width: 160px; }
    }

    .hud-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .hud-code {
      font-family: 'Courier New', monospace, Consolas;
      font-size: 11px;
      font-weight: 600;
    }
  </style>

  <!-- Container Base -->
  <rect x="2" y="2" width="916" height="356" rx="16" fill="url(#nnDarkBg)" stroke="#1E293B" stroke-width="2"/>

  <!-- Matrix Background Pattern Grid -->
  <g stroke="rgba(139, 92, 246, 0.04)" stroke-width="1">
    <line x1="20" y1="90" x2="900" y2="90"/>
    <line x1="20" y1="180" x2="900" y2="180"/>
    <line x1="20" y1="270" x2="900" y2="270"/>
    <line x1="160" y1="20" x2="160" y2="340"/>
    <line x1="330" y1="20" x2="330" y2="340"/>
    <line x1="490" y1="20" x2="490" y2="340"/>
    <line x1="650" y1="20" x2="650" y2="340"/>
  </g>

  <!-- Header Pill -->
  <g transform="translate(30, 20)">
    <rect width="360" height="26" rx="13" fill="rgba(139, 92, 246, 0.12)" stroke="#8B5CF6" stroke-width="1.2"/>
    <circle cx="14" cy="13" r="4" fill="#A855F7" filter="url(#synapseGlow)"/>
    <text x="26" y="17" fill="#C084FC" class="hud-title">🧠 NEURAL ENGINE // TEMPORAL BiGRU CLASSIFIER</text>
  </g>

  <!-- Layer Column Headers -->
  <g transform="translate(0, 70)">
    <text x="80" y="0" text-anchor="middle" fill="#00F5FF" class="hud-title">INPUT (75-PTS)</text>
    <text x="240" y="0" text-anchor="middle" fill="#A855F7" class="hud-title">FORWARD GRU (h→)</text>
    <text x="400" y="0" text-anchor="middle" fill="#EC4899" class="hud-title">BACKWARD GRU (←h)</text>
    <text x="560" y="0" text-anchor="middle" fill="#F59E0B" class="hud-title">DENSE FUSION</text>
  </g>

  <!-- ================= SYNAPTIC CONNECTIONS (WIRES) ================= -->
  <!-- Layer 1 (x:80) to Layer 2 (x:240) -->
  <g stroke="rgba(0, 245, 255, 0.12)" stroke-width="1.2">
    <!-- Static baseline wires -->
    <line x1="80" y1="110" x2="240" y2="120"/><line x1="80" y1="110" x2="240" y2="170"/><line x1="80" y1="110" x2="240" y2="230"/>
    <line x1="80" y1="160" x2="240" y2="120"/><line x1="80" y1="160" x2="240" y2="170"/><line x1="80" y1="160" x2="240" y2="230"/><line x1="80" y1="160" x2="240" y2="290"/>
    <line x1="80" y1="210" x2="240" y2="120"/><line x1="80" y1="210" x2="240" y2="170"/><line x1="80" y1="210" x2="240" y2="230"/><line x1="80" y1="210" x2="240" y2="290"/>
    <line x1="80" y1="260" x2="240" y2="170"/><line x1="80" y1="260" x2="240" y2="230"/><line x1="80" y1="260" x2="240" y2="290"/>
    <line x1="80" y1="310" x2="240" y2="230"/><line x1="80" y1="310" x2="240" y2="290"/>
  </g>

  <!-- Layer 2 (x:240) to Layer 3 (x:400) -->
  <g stroke="rgba(168, 85, 247, 0.12)" stroke-width="1.2">
    <line x1="240" y1="120" x2="400" y2="130"/><line x1="240" y1="120" x2="400" y2="190"/><line x1="240" y1="120" x2="400" y2="260"/>
    <line x1="240" y1="170" x2="400" y2="130"/><line x1="240" y1="170" x2="400" y2="190"/><line x1="240" y1="170" x2="400" y2="260"/>
    <line x1="240" y1="230" x2="400" y2="130"/><line x1="240" y1="230" x2="400" y2="190"/><line x1="240" y1="230" x2="400" y2="260"/>
    <line x1="240" y1="290" x2="400" y2="190"/><line x1="240" y1="290" x2="400" y2="260"/>
  </g>

  <!-- Layer 3 (x:400) to Layer 4 Dense (x:560) -->
  <g stroke="rgba(236, 72, 153, 0.12)" stroke-width="1.2">
    <line x1="400" y1="130" x2="560" y2="150"/><line x1="400" y1="130" x2="560" y2="210"/><line x1="400" y1="130" x2="560" y2="270"/>
    <line x1="400" y1="190" x2="560" y2="150"/><line x1="400" y1="190" x2="560" y2="210"/><line x1="400" y1="190" x2="560" y2="270"/>
    <line x1="400" y1="260" x2="560" y2="150"/><line x1="400" y1="260" x2="560" y2="210"/><line x1="400" y1="260" x2="560" y2="270"/>
  </g>

  <!-- ================= ACTIVE PULSING SYNAPSE SIGNALS ================= -->
  <!-- Forward Pulses -->
  <g stroke="url(#synapseFwd)" stroke-width="2.5" fill="none" filter="url(#synapseGlow)">
    <line x1="80" y1="110" x2="240" y2="170" class="syn-pulse-fast"/>
    <line x1="80" y1="210" x2="240" y2="120" class="syn-pulse-med"/>
    <line x1="80" y1="260" x2="240" y2="290" class="syn-pulse-slow"/>

    <line x1="240" y1="170" x2="400" y2="130" class="syn-pulse-fast"/>
    <line x1="240" y1="230" x2="400" y2="190" class="syn-pulse-med"/>
    <line x1="240" y1="120" x2="400" y2="260" class="syn-pulse-slow"/>

    <line x1="400" y1="130" x2="560" y2="210" class="syn-pulse-fast"/>
    <line x1="400" y1="190" x2="560" y2="150" class="syn-pulse-med"/>
    <line x1="400" y1="260" x2="560" y2="270" class="syn-pulse-fast"/>
  </g>

  <!-- Backward Recurrent Temporal Pulses (BiGRU Feedback) -->
  <g stroke="url(#synapseBwd)" stroke-width="2" fill="none" filter="url(#synapseGlow)">
    <path d="M 400 130 C 330 90, 310 90, 240 120" class="syn-pulse-bwd"/>
    <path d="M 400 260 C 330 330, 310 330, 240 290" class="syn-pulse-bwd"/>
  </g>

  <!-- ================= NEURON NODES ================= -->
  <!-- Layer 1: Inputs (x:80) -->
  <g>
    <circle cx="80" cy="110" r="6" class="neuron-in"/>
    <circle cx="80" cy="160" r="6" class="neuron-in"/>
    <circle cx="80" cy="210" r="6" class="neuron-in"/>
    <circle cx="80" cy="260" r="6" class="neuron-in"/>
    <circle cx="80" cy="310" r="6" class="neuron-in"/>
  </g>

  <!-- Layer 2: Forward GRU (x:240) -->
  <g>
    <circle cx="240" cy="120" r="8" class="neuron-fwd"/>
    <circle cx="240" cy="170" r="8" class="neuron-fwd"/>
    <circle cx="240" cy="230" r="8" class="neuron-fwd"/>
    <circle cx="240" cy="290" r="8" class="neuron-fwd"/>
  </g>

  <!-- Layer 3: Backward GRU (x:400) -->
  <g>
    <circle cx="400" cy="130" r="8" class="neuron-bwd"/>
    <circle cx="400" cy="190" r="8" class="neuron-bwd"/>
    <circle cx="400" cy="260" r="8" class="neuron-bwd"/>
  </g>

  <!-- Layer 4: Dense Fusion (x:560) -->
  <g>
    <circle cx="560" cy="150" r="8" class="neuron-fwd" fill="#F59E0B"/>
    <circle cx="560" cy="210" r="9" class="neuron-fwd" fill="#F59E0B"/>
    <circle cx="560" cy="270" r="8" class="neuron-fwd" fill="#F59E0B"/>
  </g>

  <!-- ================= RIGHT: SOFTMAX & CLASSIFICATION TELEMETRY ================= -->
  <g transform="translate(640, 60)">
    <rect width="255" height="270" rx="10" fill="rgba(15, 23, 42, 0.88)" stroke="#334155" stroke-width="1.2"/>
    
    <!-- Title -->
    <text x="15" y="25" fill="#38BDF8" class="hud-code" font-size="11" font-weight="700">
      ⚡ SOFTMAX GLOSS PREDICTIONS
    </text>

    <!-- Prediction 1: HELLO (Top) -->
    <g transform="translate(15, 45)">
      <text x="0" y="12" fill="#FFFFFF" class="hud-code">1. "HELLO" (ISL_01)</text>
      <text x="175" y="12" fill="#10B981" class="hud-code">98.4%</text>
      <!-- Background Bar -->
      <rect x="0" y="20" width="225" height="8" rx="4" fill="rgba(255,255,255,0.08)"/>
      <!-- Animated Active Bar -->
      <rect x="0" y="20" width="160" height="8" rx="4" fill="url(#barGlowGrad)" class="prob-bar-top" filter="url(#synapseGlow)"/>
    </g>

    <!-- Prediction 2: THANK YOU -->
    <g transform="translate(15, 95)">
      <text x="0" y="12" fill="#94A3B8" class="hud-code">2. "THANK YOU"</text>
      <text x="180" y="12" fill="#94A3B8" class="hud-code">1.1%</text>
      <rect x="0" y="20" width="225" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
      <rect x="0" y="20" width="15" height="6" rx="3" fill="#64748B"/>
    </g>

    <!-- Prediction 3: WELCOME -->
    <g transform="translate(15, 140)">
      <text x="0" y="12" fill="#94A3B8" class="hud-code">3. "WELCOME"</text>
      <text x="180" y="12" fill="#94A3B8" class="hud-code">0.3%</text>
      <rect x="0" y="20" width="225" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
      <rect x="0" y="20" width="8" height="6" rx="3" fill="#64748B"/>
    </g>

    <!-- Model Stats -->
    <g transform="translate(15, 190)">
      <line x1="0" y1="0" x2="225" y2="0" stroke="#334155" stroke-dasharray="3,3"/>
      <text x="0" y="20" fill="#64748B" class="hud-code" font-size="10">INFERENCE LATENCY :</text>
      <text x="160" y="20" fill="#38BDF8" class="hud-code" font-size="10">18.4 ms</text>
      
      <text x="0" y="38" fill="#64748B" class="hud-code" font-size="10">BATCH TIMESTEPS   :</text>
      <text x="160" y="38" fill="#38BDF8" class="hud-code" font-size="10">T = 30</text>

      <text x="0" y="56" fill="#64748B" class="hud-code" font-size="10">TOP-1 CONFIDENCE  :</text>
      <text x="160" y="56" fill="#10B981" class="hud-code" font-size="10">&gt; 0.95</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="100%" height="100%">
  <defs>
    <linearGradient id="hudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0A1128"/>
      <stop offset="100%" stop-color="#070C1A"/>
    </linearGradient>

    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="50%" stop-color="rgba(0, 245, 255, 0.6)"/>
      <stop offset="100%" stop-color="#00F5FF"/>
    </linearGradient>

    <filter id="handGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Hand gesture articulation loop */
    .finger-index {
      animation: indexCurl 4s ease-in-out infinite alternate;
      transform-origin: 340px 180px;
    }
    @keyframes indexCurl {
      0% { transform: rotate(0deg); }
      50% { transform: rotate(-8deg); }
      100% { transform: rotate(6deg); }
    }

    .finger-middle {
      animation: middleCurl 4s ease-in-out infinite alternate 0.3s;
      transform-origin: 380px 170px;
    }
    @keyframes middleCurl {
      0% { transform: rotate(0deg); }
      50% { transform: rotate(-10deg); }
      100% { transform: rotate(4deg); }
    }

    .finger-thumb {
      animation: thumbMotion 3.5s ease-in-out infinite alternate;
      transform-origin: 280px 220px;
    }
    @keyframes thumbMotion {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(12deg) scale(0.96); }
      100% { transform: rotate(-6deg) scale(1.02); }
    }

    /* Joint dot pulse */
    .joint-dot {
      animation: jointPulse 1.8s ease-in-out infinite alternate;
    }
    @keyframes jointPulse {
      0% { r: 4px; fill: #00F5FF; filter: drop-shadow(0 0 2px #00F5FF); }
      100% { r: 6.5px; fill: #FF007A; filter: drop-shadow(0 0 8px #FF007A); }
    }

    /* Scanner beam */
    .scanner-line {
      animation: scanSweep 3s linear infinite;
    }
    @keyframes scanSweep {
      0% { transform: translateY(0px); opacity: 0; }
      15% { opacity: 0.9; }
      85% { opacity: 0.9; }
      100% { transform: translateY(280px); opacity: 0; }
    }

    .telemetry-code {
      font-family: 'Courier New', monospace, Consolas;
      font-size: 11px;
      font-weight: 600;
      fill: #38BDF8;
    }

    .telemetry-val {
      font-family: 'Courier New', monospace, Consolas;
      font-size: 11px;
      font-weight: 700;
      fill: #F43F5E;
    }
  </style>

  <!-- Container -->
  <rect x="2" y="2" width="916" height="316" rx="16" fill="url(#hudBg)" stroke="#1E293B" stroke-width="2"/>

  <!-- Grid overlay -->
  <g stroke="rgba(0, 245, 255, 0.05)" stroke-width="1">
    <line x1="20" y1="80" x2="900" y2="80"/>
    <line x1="20" y1="160" x2="900" y2="160"/>
    <line x1="20" y1="240" x2="900" y2="240"/>
    <line x1="200" y1="20" x2="200" y2="300"/>
    <line x1="500" y1="20" x2="500" y2="300"/>
    <line x1="720" y1="20" x2="720" y2="300"/>
  </g>

  <!-- Scanner line -->
  <g class="scanner-line">
    <line x1="20" y1="20" x2="490" y2="20" stroke="url(#laserBeam)" stroke-width="2" filter="url(#handGlow)"/>
  </g>

  <!-- ================= LEFT / CENTER: MEDIAPIPE HAND WIREFRAME ================= -->
  <g transform="translate(-10, 20)">
    <!-- Palm / Base Bones -->
    <path d="M 280 270 L 320 220 L 370 215 L 410 230 L 440 260 L 380 285 Z" fill="rgba(0, 245, 255, 0.04)" stroke="#0072FF" stroke-width="2"/>

    <!-- Thumb Joint Chain -->
    <g class="finger-thumb">
      <polyline points="320,220 270,195 240,165 220,135" fill="none" stroke="#00F5FF" stroke-width="2.5" stroke-dasharray="6,2"/>
      <circle cx="270" cy="195" r="4.5" class="joint-dot"/>
      <circle cx="240" cy="165" r="5" class="joint-dot"/>
      <circle cx="220" cy="135" r="6" fill="#FF007A" filter="url(#handGlow)"/>
      <text x="145" y="138" class="telemetry-code">THUMB_TIP [4]</text>
    </g>

    <!-- Index Finger Joint Chain -->
    <g class="finger-index">
      <polyline points="320,220 330,160 340,110 345,65" fill="none" stroke="#00F5FF" stroke-width="2.5"/>
      <circle cx="330" cy="160" r="4.5" class="joint-dot"/>
      <circle cx="340" cy="110" r="5" class="joint-dot"/>
      <circle cx="345" cy="65" r="6" fill="#FF007A" filter="url(#handGlow)"/>
      <text x="355" y="68" class="telemetry-code">INDEX_TIP [8]</text>
    </g>

    <!-- Middle Finger Joint Chain -->
    <g class="finger-middle">
      <polyline points="370,215 380,150 390,95 395,45" fill="none" stroke="#00F5FF" stroke-width="2.5"/>
      <circle cx="380" cy="150" r="4.5" class="joint-dot"/>
      <circle cx="390" cy="95" r="5" class="joint-dot"/>
      <circle cx="395" cy="45" r="6" fill="#FF007A" filter="url(#handGlow)"/>
      <text x="405" y="48" class="telemetry-code">MID_TIP [12]</text>
    </g>

    <!-- Ring Finger Joint Chain -->
    <g>
      <polyline points="410,230 425,175 435,125 440,85" fill="none" stroke="#00F5FF" stroke-width="2.5"/>
      <circle cx="425" cy="175" r="4.5" class="joint-dot"/>
      <circle cx="435" cy="125" r="5" class="joint-dot"/>
      <circle cx="440" cy="85" r="6" fill="#FF007A" filter="url(#handGlow)"/>
    </g>

    <!-- Pinky Finger Joint Chain -->
    <g>
      <polyline points="440,260 465,215 480,170 490,135" fill="none" stroke="#00F5FF" stroke-width="2.5"/>
      <circle cx="465" cy="215" r="4.5" class="joint-dot"/>
      <circle cx="480" cy="170" r="5" class="joint-dot"/>
      <circle cx="490" cy="135" r="6" fill="#FF007A" filter="url(#handGlow)"/>
      <text x="500" y="138" class="telemetry-code">PINKY_TIP [20]</text>
    </g>

    <!-- Wrist Joint -->
    <circle cx="340" cy="285" r="8" fill="#7928CA" stroke="#00F5FF" stroke-width="2" filter="url(#handGlow)"/>
    <text x="260" y="290" class="telemetry-code">WRIST [0]</text>
  </g>

  <!-- ================= RIGHT: REAL-TIME TELEMETRY HUD ================= -->
  <g transform="translate(530, 25)">
    <!-- Header -->
    <rect width="360" height="30" rx="6" fill="rgba(0, 245, 255, 0.1)" stroke="#00F5FF" stroke-width="1.2"/>
    <text x="15" y="20" fill="#00F5FF" font-family="'Courier New', monospace" font-size="12" font-weight="700">
      ⚡ HOLISTIC TRACKER TELEMETRY // 75 LANDMARKS
    </text>

    <!-- Row 1 -->
    <g transform="translate(0, 48)">
      <text x="10" y="15" class="telemetry-code">PIPELINE STATUS :</text>
      <text x="160" y="15" class="telemetry-val" fill="#10B981">ONLINE (ACTIVE)</text>
      <text x="10" y="35" class="telemetry-code">FRAME RATE      :</text>
      <text x="160" y="35" class="telemetry-val" fill="#00F5FF">30.2 FPS (STABLE)</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(0, 105)">
      <rect width="360" height="75" rx="8" fill="rgba(15, 23, 42, 0.8)" stroke="#334155" stroke-width="1"/>
      <text x="15" y="22" class="telemetry-code">HAND LEFT [21 PTS]  :</text>
      <text x="200" y="22" class="telemetry-val" fill="#10B981">TRACKED (0.98)</text>
      
      <text x="15" y="42" class="telemetry-code">HAND RIGHT [21 PTS] :</text>
      <text x="200" y="42" class="telemetry-val" fill="#10B981">TRACKED (0.97)</text>

      <text x="15" y="62" class="telemetry-code">UPPER POSE [33 PTS] :</text>
      <text x="200" y="62" class="telemetry-val" fill="#10B981">TRACKED (0.99)</text>
    </g>

    <!-- Row 3: Live Coordinates Feed -->
    <g transform="translate(0, 200)">
      <rect width="360" height="70" rx="8" fill="rgba(15, 23, 42, 0.8)" stroke="#334155" stroke-width="1"/>
      <text x="15" y="20" fill="#94A3B8" class="telemetry-code">NORMALIZED COORDINATE VECTOR:</text>
      <text x="15" y="38" fill="#F472B6" class="telemetry-code">X: [+0.4129, +0.3812, +0.5519, ...] </text>
      <text x="15" y="55" fill="#38BDF8" class="telemetry-code">Y: [-0.1983, +0.2241, +0.8841, ...] </text>
    </g>
  </g>
</svg>

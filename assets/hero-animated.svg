<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="heroDarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="40%" stop-color="#0B1120"/>
      <stop offset="80%" stop-color="#0E0A24"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Neon Gradients -->
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#0072FF"/>
      <stop offset="100%" stop-color="#7B2CBF"/>
    </linearGradient>

    <linearGradient id="cyberPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF007A"/>
      <stop offset="50%" stop-color="#9D4EDD"/>
      <stop offset="100%" stop-color="#00F5FF"/>
    </linearGradient>

    <linearGradient id="borderBeamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="25%" stop-color="#FF007A"/>
      <stop offset="50%" stop-color="#7928CA"/>
      <stop offset="75%" stop-color="#4361EE"/>
      <stop offset="100%" stop-color="#00F5FF"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="superGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="16" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Pattern Grid -->
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0, 245, 255, 0.07)" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    /* ================= KEYFRAME ANIMATIONS ================= */
    /* Traveling border laser */
    .laser-border {
      stroke-dasharray: 180, 760;
      animation: laserTravel 6s linear infinite;
    }
    @keyframes laserTravel {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -1880; }
    }

    /* Holographic Radar Rings */
    .hud-spin-cw {
      transform-origin: 800px 190px;
      animation: spinCW 14s linear infinite;
    }
    .hud-spin-ccw {
      transform-origin: 800px 190px;
      animation: spinCCW 9s linear infinite;
    }
    .hud-spin-slow {
      transform-origin: 800px 190px;
      animation: spinCW 24s linear infinite;
    }
    @keyframes spinCW {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spinCCW {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }

    /* Floating Hologram */
    .hologram-float {
      animation: holoFloat 4s ease-in-out infinite alternate;
    }
    @keyframes holoFloat {
      0% { transform: translateY(0px); filter: drop-shadow(0 0 10px rgba(0, 245, 255, 0.6)); }
      100% { transform: translateY(-8px); filter: drop-shadow(0 0 24px rgba(255, 0, 122, 0.8)); }
    }

    /* Scanline Sweep */
    .scanline {
      animation: scanSweep 3.5s ease-in-out infinite;
    }
    @keyframes scanSweep {
      0% { transform: translateY(-20px); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% { transform: translateY(400px); opacity: 0; }
    }

    /* Glowing Text Flicker */
    .cyber-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif;
      font-weight: 900;
      letter-spacing: 2px;
      animation: neonPulse 2.5s ease-in-out infinite alternate;
    }
    @keyframes neonPulse {
      0% { filter: drop-shadow(0 0 8px rgba(0, 245, 255, 0.7)); }
      50% { filter: drop-shadow(0 0 20px rgba(255, 0, 122, 0.9)) drop-shadow(0 0 35px rgba(0, 245, 255, 0.6)); }
      100% { filter: drop-shadow(0 0 12px rgba(0, 245, 255, 0.8)); }
    }

    /* Equalizer Bars */
    .eq-bar-1 { animation: eqBounce 0.8s ease-in-out infinite alternate; transform-origin: bottom; }
    .eq-bar-2 { animation: eqBounce 1.2s ease-in-out infinite alternate 0.2s; transform-origin: bottom; }
    .eq-bar-3 { animation: eqBounce 0.6s ease-in-out infinite alternate 0.4s; transform-origin: bottom; }
    .eq-bar-4 { animation: eqBounce 1.0s ease-in-out infinite alternate 0.1s; transform-origin: bottom; }
    .eq-bar-5 { animation: eqBounce 0.7s ease-in-out infinite alternate 0.3s; transform-origin: bottom; }
    .eq-bar-6 { animation: eqBounce 1.1s ease-in-out infinite alternate 0.5s; transform-origin: bottom; }
    .eq-bar-7 { animation: eqBounce 0.9s ease-in-out infinite alternate 0.25s; transform-origin: bottom; }
    @keyframes eqBounce {
      0% { height: 6px; }
      100% { height: 32px; }
    }

    /* Ambient Pulsing Particles */
    .pulse-p1 { animation: pFade 2s infinite alternate; }
    .pulse-p2 { animation: pFade 3s infinite alternate 1s; }
    .pulse-p3 { animation: pFade 2.4s infinite alternate 0.5s; }
    @keyframes pFade {
      0% { opacity: 0.2; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.3); }
    }

    .badge-hud {
      font-family: 'Courier New', monospace, Consolas;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 1px;
    }
  </style>

  <!-- Background Base -->
  <rect x="2" y="2" width="936" height="376" rx="20" fill="url(#heroDarkBg)" stroke="#161F38" stroke-width="2"/>
  <rect x="2" y="2" width="936" height="376" rx="20" fill="url(#cyberGrid)"/>

  <!-- Glowing Laser Border Traveling Loop -->
  <rect x="3" y="3" width="934" height="374" rx="19" fill="none" stroke="url(#borderBeamGrad)" stroke-width="3" class="laser-border" filter="url(#softGlow)"/>

  <!-- Scanning Line Projection Effect -->
  <g class="scanline">
    <line x1="10" y1="0" x2="930" y2="0" stroke="url(#cyberCyan)" stroke-width="2" opacity="0.6" filter="url(#softGlow)"/>
    <rect x="10" y="-15" width="920" height="15" fill="url(#cyberCyan)" opacity="0.06"/>
  </g>

  <!-- Tech Corner Brackets -->
  <g stroke="#00F5FF" stroke-width="2" fill="none" opacity="0.8">
    <path d="M 15 35 L 15 15 L 35 15"/>
    <path d="M 925 35 L 925 15 L 905 15"/>
    <path d="M 15 345 L 15 365 L 35 365"/>
    <path d="M 925 345 L 925 365 L 905 365"/>
  </g>

  <!-- ================= BACKGROUND PARTICLES ================= -->
  <circle cx="120" cy="80" r="2" fill="#00F5FF" class="pulse-p1"/>
  <circle cx="280" cy="50" r="2.5" fill="#FF007A" class="pulse-p2"/>
  <circle cx="440" cy="90" r="1.5" fill="#7928CA" class="pulse-p3"/>
  <circle cx="210" cy="310" r="2" fill="#00F5FF" class="pulse-p2"/>
  <circle cx="530" cy="320" r="2" fill="#FF007A" class="pulse-p1"/>
  <circle cx="670" cy="70" r="3" fill="#00F5FF" class="pulse-p3"/>

  <!-- ================= LEFT: CONTENT SECTION ================= -->
  <g transform="translate(48, 55)">
    <!-- Top HUD Tag -->
    <g transform="translate(0, 0)">
      <rect width="260" height="26" rx="13" fill="rgba(0, 245, 255, 0.08)" stroke="#00F5FF" stroke-width="1.2"/>
      <circle cx="14" cy="13" r="4" fill="#00F5FF" filter="url(#softGlow)"/>
      <text x="26" y="17" fill="#00F5FF" class="badge-hud">SYSTEM // ISL ⇄ EN LIVE ENGINE</text>
    </g>

    <!-- Main Title with Glowing 3D effect -->
    <g transform="translate(0, 65)">
      <!-- Drop shadow layered -->
      <text x="2" y="2" fill="#FF007A" font-size="54" class="cyber-title" opacity="0.4">SIGNBRIDGE</text>
      <text x="0" y="0" fill="url(#cyberCyan)" font-size="54" class="cyber-title" filter="url(#superGlow)">SIGNBRIDGE</text>
      <text x="0" y="0" fill="#FFFFFF" font-size="54" class="cyber-title">SIGNBRIDGE</text>
    </g>

    <!-- Subtitle Japanese / Cyber Tagline -->
    <text x="370" y="105" fill="#FF007A" font-family="'Courier New', monospace" font-size="13" font-weight="700" letter-spacing="3">手話ブリッジ // V2.0 PROTOTYPE</text>

    <!-- Description -->
    <text x="0" y="145" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600">
      Next-Gen Bidirectional Indian Sign Language AI
    </text>
    <text x="0" y="172" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      MediaPipe 75-Point Holistic Vision • PyTorch BiGRU Deep Recurrent Neural Net •
    </text>
    <text x="0" y="194" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      Interactive Three.js 3D Skeletal Avatar Synthesis • SOV Grammar Engine
    </text>

    <!-- Live HUD Status Badges -->
    <g transform="translate(0, 222)">
      <!-- Badge 1: 3D Avatar -->
      <g transform="translate(0, 0)">
        <rect width="130" height="28" rx="6" fill="rgba(16, 185, 129, 0.12)" stroke="#10B981" stroke-width="1.2"/>
        <circle cx="12" cy="14" r="3.5" fill="#10B981" filter="url(#softGlow)"/>
        <text x="24" y="18" fill="#34D399" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">3D AVATAR : 60FPS</text>
      </g>

      <!-- Badge 2: MediaPipe -->
      <g transform="translate(140, 0)">
        <rect width="135" height="28" rx="6" fill="rgba(0, 245, 255, 0.12)" stroke="#00F5FF" stroke-width="1.2"/>
        <circle cx="12" cy="14" r="3.5" fill="#00F5FF" filter="url(#softGlow)"/>
        <text x="24" y="18" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">TRACKING : 75 PTS</text>
      </g>

      <!-- Badge 3: Neural Model -->
      <g transform="translate(285, 0)">
        <rect width="130" height="28" rx="6" fill="rgba(255, 0, 122, 0.12)" stroke="#FF007A" stroke-width="1.2"/>
        <circle cx="12" cy="14" r="3.5" fill="#FF007A" filter="url(#softGlow)"/>
        <text x="24" y="18" fill="#F472B6" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">BiGRU : PYTORCH</text>
      </g>
    </g>

    <!-- Equalizer Spectrum at Bottom Left -->
    <g transform="translate(0, 275)">
      <text x="0" y="15" fill="#64748B" font-family="'Courier New', monospace" font-size="10" font-weight="700">LATENCY SPECTRUM</text>
      <g transform="translate(130, 18) scale(1, -1)">
        <rect x="0" y="0" width="4" height="10" fill="#00F5FF" class="eq-bar-1"/>
        <rect x="7" y="0" width="4" height="18" fill="#00F5FF" class="eq-bar-2"/>
        <rect x="14" y="0" width="4" height="25" fill="#38BDF8" class="eq-bar-3"/>
        <rect x="21" y="0" width="4" height="12" fill="#818CF8" class="eq-bar-4"/>
        <rect x="28" y="0" width="4" height="28" fill="#A855F7" class="eq-bar-5"/>
        <rect x="35" y="0" width="4" height="16" fill="#EC4899" class="eq-bar-6"/>
        <rect x="42" y="0" width="4" height="22" fill="#FF007A" class="eq-bar-7"/>
        <rect x="49" y="0" width="4" height="14" fill="#FF007A" class="eq-bar-2"/>
        <rect x="56" y="0" width="4" height="8" fill="#00F5FF" class="eq-bar-4"/>
      </g>
    </g>
  </g>

  <!-- ================= RIGHT: HOLOGRAPHIC 3D HUD & AVATAR ================= -->
  <!-- Center of HUD circles: (800, 190) -->
  <g class="hologram-float">
    <!-- Outer Compass Ticks -->
    <circle cx="800" cy="190" r="130" fill="none" stroke="rgba(0, 245, 255, 0.15)" stroke-width="1.5" stroke-dasharray="4, 16"/>

    <!-- Rotating Ring 1 (Clockwise) -->
    <g class="hud-spin-cw">
      <circle cx="800" cy="190" r="115" fill="none" stroke="url(#cyberCyan)" stroke-width="2" stroke-dasharray="140, 40, 20, 40"/>
      <circle cx="800" cy="75" r="4" fill="#00F5FF" filter="url(#softGlow)"/>
      <circle cx="800" cy="305" r="4" fill="#00F5FF" filter="url(#softGlow)"/>
    </g>

    <!-- Rotating Ring 2 (Counter-Clockwise) -->
    <g class="hud-spin-ccw">
      <circle cx="800" cy="190" r="92" fill="none" stroke="url(#cyberPink)" stroke-width="2" stroke-dasharray="60, 25, 10, 25"/>
      <circle cx="708" cy="190" r="3.5" fill="#FF007A" filter="url(#softGlow)"/>
      <circle cx="892" cy="190" r="3.5" fill="#FF007A" filter="url(#softGlow)"/>
    </g>

    <!-- Rotating Inner Crosshairs (Slow) -->
    <g class="hud-spin-slow">
      <circle cx="800" cy="190" r="70" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1" stroke-dasharray="5, 10"/>
      <line x1="800" y1="125" x2="800" y2="255" stroke="rgba(0, 245, 255, 0.3)" stroke-width="1"/>
      <line x1="735" y1="190" x2="865" y2="190" stroke="rgba(0, 245, 255, 0.3)" stroke-width="1"/>
    </g>

    <!-- Central Glowing Core Sphere -->
    <circle cx="800" cy="190" r="50" fill="url(#cyberPink)" opacity="0.25" filter="url(#superGlow)"/>
    <circle cx="800" cy="190" r="45" fill="url(#heroDarkBg)" stroke="#00F5FF" stroke-width="2"/>

    <!-- Cyber Hand Sign Icon inside Hologram -->
    <g transform="translate(778, 168)" stroke="#00F5FF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)">
      <!-- Animated Wireframe Hand / ISL V Sign -->
      <path d="M12 25 L12 18 C12 16 13 14 15 14 C17 14 18 16 18 18 L18 25" stroke="#FF007A"/>
      <path d="M18 18 L18 10 C18 8 19 6 21 6 C23 6 24 8 24 10 L24 25" stroke="#00F5FF"/>
      <path d="M24 12 L24 8 C24 6 25 4 27 4 C29 4 30 6 30 8 L30 25" stroke="#00F5FF"/>
      <path d="M30 16 C30 14 31 12 33 12 C35 12 36 14 36 16 L36 26 C36 34 30 40 22 40 C15 40 10 35 10 28 L10 24 C10 21 12 20 14 22 L17 25"/>
    </g>

    <!-- Orbiting Energy Dots -->
    <g class="hud-spin-cw">
      <circle cx="915" cy="190" r="4" fill="#00F5FF" filter="url(#softGlow)"/>
    </g>
    <g class="hud-spin-ccw">
      <circle cx="800" cy="100" r="3.5" fill="#FF007A" filter="url(#softGlow)"/>
    </g>
  </g>
</svg>
